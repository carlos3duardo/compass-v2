stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: registry.gitlab.com/bussoladagestao/compass:latest

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
  script:
    - ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST 'docker pull $DOCKER_IMAGE && docker stop seu-app || true && docker rm seu-app || true && docker run -d --name seu-app -p 3000:3000 $DOCKER_IMAGE'
  only:
    - main
